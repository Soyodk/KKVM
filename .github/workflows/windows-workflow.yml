name: Windows Cloud PC - Dev Setup (VSCode + Brave + Python + Node.js)

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciar Windows Cloud PC - Dev Environment
    runs-on: windows-latest
    timeout-minutes: 10080 # 7 dias

    steps:
      - name: 🔧 Instalar Ferramentas Principais
        shell: powershell
        run: |
          Write-Host "Iniciando setup otimizado..." -ForegroundColor Green
          
          winget source update

          # === Navegador Brave ===
          Write-Host "Instalando Brave Browser..."
          winget install --id Brave.Brave -e --silent --accept-source-agreements

          # === VS Code + Extensões úteis ===
          Write-Host "Instalando VS Code..."
          winget install --id Microsoft.VisualStudioCode -e --silent --accept-source-agreements
          
          # Configurações básicas do VS Code
          code --install-extension ms-python.python
          code --install-extension esbenp.prettier-vscode
          code --install-extension dbaeumer.vscode-eslint
          code --install-extension ms-vscode-remote.remote-ssh

          # === Python + pip ===
          Write-Host "Instalando Python..."
          winget install --id Python.Python.3.11 -e --silent
          refreshenv

          # === Node.js (JavaScript) ===
          Write-Host "Instalando Node.js..."
          winget install --id OpenJS.NodeJS -e --silent
          refreshenv

          # === Git ===
          winget install --id Git.Git -e --silent

          Write-Host "Ferramentas principais instaladas!" -ForegroundColor Green

      - name: ⚡ Otimizações de Performance
        shell: powershell
        run: |
          Write-Host "Aplicando otimizações..."
          
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          # Desativa serviços desnecessários
          $services = @("SysMain", "DiagTrack", "WerSvc", "dmwappushservice")
          foreach ($s in $services) {
            Stop-Service -Name $s -Force -ErrorAction SilentlyContinue
            Set-Service -Name $s -StartupType Disabled -ErrorAction SilentlyContinue
          }
          
          Write-Host "Otimizacoes aplicadas!" -ForegroundColor Green

      - name: 🌐 Configurar Sistema de Proxy (Básico)
        shell: powershell
        run: |
          Write-Host "Configurando sistema de proxy..."
          
          # Cria pasta para scripts de proxy
          New-Item -Path "C:\ProxyTools" -ItemType Directory -Force | Out-Null
          
          Write-Host "Proxy pronto para configuração manual." -ForegroundColor Yellow
          Write-Host "Você pode usar Proxifier, FoxyProxy ou configurar no Brave depois." -ForegroundColor Cyan

      - name: 📥 Download & Executar Scripts Personalizados
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1" -OutFile "Downloads.bat"
          cmd /c Downloads.bat

      - name: 🔐 Iniciar AnyDesk
        shell: powershell
        run: |
          if (Test-Path "start.bat") {
            cmd /c start.bat
            Write-Host "AnyDesk iniciado com sucesso!" -ForegroundColor Green
          } else {
            Write-Host "start.bat nao encontrado!" -ForegroundColor Red
          }

      - name: 🔄 Monitor AnyDesk (Auto-reinício)
        shell: powershell
        run: |
          while ($true) {
            if (-not (Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue)) {
              Write-Host "Reiniciando AnyDesk..." -ForegroundColor Yellow
              if (Test-Path "start.bat") { cmd /c start.bat }
            }
            Start-Sleep -Seconds 180
          }

      - name: ⏳ Manter Ativo (7 Dias)
        shell: powershell
        run: |
          Write-Host "=== Windows Cloud PC Dev Environment Pronto! ===" -ForegroundColor Cyan
          Write-Host "VS Code, Brave, Python 3.11 e Node.js instalados." -ForegroundColor Cyan
          Write-Host "Acesse via AnyDesk." -ForegroundColor Cyan
          Start-Sleep -Seconds 604800
