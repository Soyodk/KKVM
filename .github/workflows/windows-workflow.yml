name: Windows Cloud PC - Dev Setup (VSCode + Brave + Python + Node.js)

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciar Windows Cloud PC - Dev Environment
    runs-on: windows-latest
    timeout-minutes: 10080 # 7 dias

    steps:
      - name: 🔧 Instalar Ferramentas Principais
        shell: powershell
        run: |
          Write-Host "Iniciando setup otimizado..." -ForegroundColor Green
          
          winget source update --accept-source-agreements

          # Brave Browser
          Write-Host "Instalando Brave Browser..."
          winget install --id Brave.Brave -e --silent --accept-source-agreements --accept-package-agreements

          # VS Code
          Write-Host "Instalando VS Code..."
          winget install --id Microsoft.VisualStudioCode -e --silent --accept-source-agreements --accept-package-agreements --force

          # Atualiza PATH do sistema
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Start-Sleep -Seconds 15

          # Python 3.11
          Write-Host "Instalando Python 3.11..."
          winget install --id Python.Python.3.11 -e --silent --accept-source-agreements --accept-package-agreements

          # Node.js
          Write-Host "Instalando Node.js..."
          winget install --id OpenJS.NodeJS -e --silent --accept-source-agreements --accept-package-agreements

          # Git
          winget install --id Git.Git -e --silent --accept-source-agreements --accept-package-agreements

          # Atualiza PATH novamente
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Start-Sleep -Seconds 10

          # Instalar extensões do VS Code
          Write-Host "Instalando extensões do VS Code..."
          try {
            code --install-extension ms-python.python --force
            code --install-extension esbenp.prettier-vscode --force
            code --install-extension dbaeumer.vscode-eslint --force
            code --install-extension ms-vscode-remote.remote-ssh --force
            Write-Host "Extensoes do VS Code instaladas!" -ForegroundColor Green
          } catch {
            Write-Host "Aviso: Nao foi possivel instalar as extensoes automaticamente. Voce pode instalar depois via AnyDesk." -ForegroundColor Yellow
          }

          Write-Host "Ferramentas principais instaladas com sucesso!" -ForegroundColor Green

      - name: ⚡ Otimizações de Performance
        shell: powershell
        run: |
          Write-Host "Aplicando otimizacoes..."
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          $services = @("SysMain", "DiagTrack", "WerSvc", "dmwappushservice", "Telemetry")
          foreach ($s in $services) {
            Stop-Service -Name $s -Force -ErrorAction SilentlyContinue
            Set-Service -Name $s -StartupType Disabled -ErrorAction SilentlyContinue
          }
          Write-Host "Otimizacoes aplicadas!" -ForegroundColor Green

      - name: 🌐 Pasta Proxy
        shell: powershell
        run: |
          New-Item -Path "C:\ProxyTools" -ItemType Directory -Force | Out-Null
          Write-Host "Pasta C:\ProxyTools criada." -ForegroundColor Cyan

      - name: 📥 Executar Scripts Personalizados
        shell: powershell
        run: |
          Write-Host "Executando seus scripts personalizados..."
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1" -OutFile "Downloads.bat" -UseBasicParsing
          cmd /c Downloads.bat

      - name: 🔐 Iniciar AnyDesk
        shell: powershell
        run: |
          if (Test-Path "start.bat") {
            cmd /c start.bat
            Write-Host "AnyDesk iniciado!" -ForegroundColor Green
          } else {
            Write-Host "start.bat nao encontrado." -ForegroundColor Yellow
          }

      - name: 🔄 Monitor AnyDesk
        shell: powershell
        run: |
          while ($true) {
            if (-not (Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue)) {
              Write-Host "Reiniciando AnyDesk..." -ForegroundColor Yellow
              if (Test-Path "start.bat") { cmd /c start.bat }
            }
            Start-Sleep -Seconds 180
          }

      - name: ⏳ Manter Ativo (7 Dias)
        shell: powershell
        run: |
          Write-Host "=== Windows Cloud PC Dev Environment Pronto! ===" -ForegroundColor Cyan
          Write-Host "VS Code, Brave, Python 3.11 e Node.js instalados." -ForegroundColor Cyan
          Start-Sleep -Seconds 604800
