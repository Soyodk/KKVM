name: Windows Remote Access

on:
  workflow_dispatch:  # Permite execução manual

jobs:
  setup-windows-remote:
    runs-on: windows-latest
    
    steps:
      - name: Informações do Sistema
        run: |
          echo "Sistema operacional: Windows"
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
          echo "Diretório atual: $PWD"
      
      - name: Instalar Chrome Remote Desktop (Download Direto)
        run: |
          # Baixar o instalador
          echo "Baixando instalador do Chrome Remote Desktop..."
          curl -L -o chrome-remote-desktop.msi https://dl.google.com/edgedl/chrome-remote-desktop/chrome-remote-desktop_current.msi
          
          # Verificar se o download foi bem-sucedido
          if (Test-Path "chrome-remote-desktop.msi") {
            echo "Download realizado com sucesso."
          } else {
            echo "ERRO: Falha ao baixar o instalador."
            exit 1
          }
          
          # Instalar silenciosamente
          echo "Instalando Chrome Remote Desktop..."
          Start-Process msiexec.exe -Wait -ArgumentList '/i chrome-remote-desktop.msi /qn'
          
          # Verificar a instalação
          $remotePath = "C:\Program Files\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (Test-Path $remotePath) {
            echo "Chrome Remote Desktop instalado com sucesso!"
          } else {
            # Tentar encontrar onde foi instalado
            echo "Procurando pelo executável do Chrome Remote Desktop..."
            Get-ChildItem -Path "C:\Program Files" -Recurse -Filter "remoting_start_host.exe" -ErrorAction SilentlyContinue | ForEach-Object {
              echo "Encontrado em: $($_.FullName)"
              $remotePath = $_.FullName
            }
            
            if (-not $remotePath) {
              echo "ERRO: Chrome Remote Desktop não encontrado após instalação."
              exit 1
            }
          }

      - name: Configurar acesso remoto
        env:
          REMOTE_ACCESS_TOKEN: ${{ secrets.REMOTE_ACCESS_TOKEN }}
        run: |
          # Verificar se o token foi fornecido
          if ([string]::IsNullOrEmpty($env:REMOTE_ACCESS_TOKEN)) {
            echo "ERRO: Token de acesso não fornecido. Adicione o secret REMOTE_ACCESS_TOKEN ao repositório."
            exit 1
          }
          
          # Caminho do executável do Chrome Remote Desktop
          $remotePath = "C:\Program Files\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          
          # Verificar se o arquivo existe
          if (Test-Path $remotePath) {
            echo "Configurando Chrome Remote Desktop com o token fornecido..."
            
            # Configurar com o token de acesso
            Start-Process -FilePath $remotePath -ArgumentList "--code=`"$env:REMOTE_ACCESS_TOKEN`"", '--redirect-url="https://remotedesktop.google.com/_/oauthredirect"', '--name="GitHub Actions Windows"'
            
            echo "Chrome Remote Desktop configurado com sucesso!"
          } else {
            echo "ERRO: Executável do Chrome Remote Desktop não encontrado no caminho padrão."
            
            # Tentar encontrar o executável em outros locais
            $found = $false
            Get-ChildItem -Path "C:\Program Files" -Recurse -Filter "remoting_start_host.exe" -ErrorAction SilentlyContinue | ForEach-Object {
              echo "Tentando usar executável encontrado em: $($_.FullName)"
              Start-Process -FilePath $_.FullName -ArgumentList "--code=`"$env:REMOTE_ACCESS_TOKEN`"", '--redirect-url="https://remotedesktop.google.com/_/oauthredirect"', '--name="GitHub Actions Windows"'
              $found = $true
            }
            
            if (-not $found) {
              echo "ERRO: Não foi possível encontrar o executável do Chrome Remote Desktop."
              exit 1
            }
          }
          
      - name: Manter ambiente ativo
        run: |
          echo "Mantendo o ambiente Windows ativo por 2 horas..."
          $endTime = (Get-Date).AddHours(2)
          while ((Get-Date) -lt $endTime) {
            echo "Ambiente Windows ativo em: $(Get-Date) - Continuará ativo por mais $([math]::Round(($endTime - (Get-Date)).TotalMinutes)) minutos"
            Start-Sleep -Seconds 300  # Verificar a cada 5 minutos
          }
