name: Windows Remote Access

on:
  workflow_dispatch:

jobs:
  setup-windows-remote:
    runs-on: windows-latest

    steps:
      - name: Informações do Sistema
        run: |
          echo "Sistema operacional: Windows"
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
          echo "Diretório atual: $PWD"

      - name: Instalar Chrome Remote Desktop (Download Direto)
        run: |
          echo "Baixando instalador do Chrome Remote Desktop..."
          curl -L -o chrome-remote-desktop.msi https://dl.google.com/edgedl/chrome-remote-desktop/chrome-remote-desktop_current.msi

          if (Test-Path "chrome-remote-desktop.msi") {
            echo "Download realizado com sucesso."
          } else {
            echo "ERRO: Falha ao baixar o instalador."
            exit 1
          }

          echo "Instalando Chrome Remote Desktop..."
          Start-Process msiexec.exe -Wait -ArgumentList '/i chrome-remote-desktop.msi /qn'

      - name: Esperar pelo token se estiver ausente
        env:
          REMOTE_ACCESS_TOKEN: ${{ secrets.REMOTE_ACCESS_TOKEN }}
        run: |
          $maxWait = 600  # tempo máximo de espera em segundos (10 minutos)
          $waited = 0
          while ([string]::IsNullOrEmpty($env:REMOTE_ACCESS_TOKEN) -and $waited -lt $maxWait) {
            echo "Aguardando o token REMOTE_ACCESS_TOKEN... ($waited s)"
            Start-Sleep -Seconds 10
            $waited += 360
            $env:REMOTE_ACCESS_TOKEN = "${{ secrets.REMOTE_ACCESS_TOKEN }}"
          }

          if ([string]::IsNullOrEmpty($env:REMOTE_ACCESS_TOKEN)) {
            echo "ERRO: Token de acesso não fornecido após aguardar $maxWait segundos."
            exit 1
          }

          echo "Token obtido com sucesso!"

      - name: Configurar acesso remoto
        env:
          REMOTE_ACCESS_TOKEN: ${{ secrets.REMOTE_ACCESS_TOKEN }}
        run: |
          $remotePath = "C:\Program Files\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $remotePath)) {
            Get-ChildItem -Path "C:\Program Files" -Recurse -Filter "remoting_start_host.exe" -ErrorAction SilentlyContinue | ForEach-Object {
              $remotePath = $_.FullName
            }
          }

          if (Test-Path $remotePath) {
            echo "Configurando com token..."
            Start-Process -FilePath $remotePath -ArgumentList "--code=`"$env:REMOTE_ACCESS_TOKEN`"", '--redirect-url="https://remotedesktop.google.com/_/oauthredirect"', '--name="GitHub Actions Windows"'
            echo "Configuração concluída."
          } else {
            echo "ERRO: Executável não encontrado."
            exit 1
          }

      - name: Manter ambiente ativo
        run: |
          echo "Mantendo o ambiente Windows ativo por 2 horas..."
          $endTime = (Get-Date).AddHours(2)
          while ((Get-Date) -lt $endTime) {
            echo "Ambiente ativo: $(Get-Date) - Restante: $([math]::Round(($endTime - (Get-Date)).TotalMinutes)) minutos"
            Start-Sleep -Seconds 300
          }
